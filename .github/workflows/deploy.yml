# Builds the planner and publishes it to GitHub Pages.
# One-time setup (repo owner): Settings → Pages → Source: "GitHub Actions".
# Custom domain: set repo variable PAGES_BASE_PATH to "/" and add the domain under Settings → Pages.
name: Deploy to GitHub Pages
on:
  push:
    # The repo's default branch is currently claude/vibrant-tesla-hui4mo (it was the first branch pushed).
    # Pages only deploys from the default branch; drop it from this list once main exists and is the default.
    branches: [main, claude/vibrant-tesla-hui4mo]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Report build configuration (presence only, never values)
        run: |
          echo "Supabase URL set:        ${{ vars.VITE_SUPABASE_URL != '' }}"
          echo "Supabase anon key set:   ${{ vars.VITE_SUPABASE_ANON_KEY != '' }}"
          echo "Google client ID set:    ${{ vars.VITE_GOOGLE_CLIENT_ID != '' }}"
          case "${{ vars.VITE_SUPABASE_URL }}" in https://*.supabase.co|"") ;; *) echo "::warning::VITE_SUPABASE_URL should look like https://<project-id>.supabase.co (no /rest/v1)";; esac
          case "${{ vars.VITE_SUPABASE_ANON_KEY }}" in sb_secret_*) echo "::error::VITE_SUPABASE_ANON_KEY is a SECRET key. Use the sb_publishable_ key."; exit 1;; esac
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_MEALDB_KEY: ${{ vars.VITE_MEALDB_KEY }}
          # Public by design (RLS protects data). Never add the service_role key here.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
